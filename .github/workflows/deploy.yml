name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Keyless: GitHub's OIDC token is exchanged for short-lived credentials
      # for github-action-deploy@. The trust only accepts this repo (by numeric
      # id) on main. No long-lived key.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/622256087543/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-action-deploy@mt-services-swantron.iam.gserviceaccount.com

      - run: npm install -g firebase-tools@15

      - name: Deploy hosting
        run: firebase deploy --only hosting --project mt-services-swantron --non-interactive

  # Post-deploy gate: drive synthetic golden-signal traffic at the live URL and
  # confirm the telemetry landed in the watchtron control plane (black-box —
  # availability, p95 and route coverage). No-ops if the secrets aren't set yet.
  watchtron-verify:
    needs: deploy
    uses: swantron/watchtron/.github/workflows/verify.yml@main
    with:
      service: mt
    secrets:
      otlp_endpoint: ${{ secrets.WATCHTRON_OTLP_ENDPOINT }}
      token: ${{ secrets.WATCHTRON_TOKEN }}
